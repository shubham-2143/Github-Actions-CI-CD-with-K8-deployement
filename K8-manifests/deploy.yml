apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodeapp
  template:
    metadata:
      labels:
        app: nodeapp
    spec:
      containers:
      - name: my-new-app
        image: 654654410356.dkr.ecr.us-east-1.amazonaws.com/nodeapp:v2
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
